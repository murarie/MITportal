<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to MITportal">
    <title>MITportal | Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Animated background shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <main class="container">
        <div class="glass-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Enter your credentials to access MITportal</p>
            
            <form action="index.html" method="GET">
                <div class="form-group">
                    <label for="email">Student Email</label>
                    <input type="email" id="email" name="email" placeholder="student@mit.edu" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Login to Portal</button>
            </form>
            
            <div class="auth-links">
                <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
                <p style="margin-top: 0.5rem;"><a href="index.html">← Back to Home</a></p>
            </div>
        </div>
    </main>
</body>
</html>
